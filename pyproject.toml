[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytdl-pro"
version = "1.0.0"
description = "Downloader profissional YouTube com interface TUI"
requires-python = ">=3.9"
dependencies = [
    "yt-dlp>=2024.1.0",
    "textual>=8.0.0",
]

[project.scripts]
ytdl-pro = "ytdl_pro.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ytdl_pro*"]